# OxiBus Global Configuration

[project]
name    = "oxibus"
version = "0.1.0"
author  = "alizain"
email   = "alizain@zainiumdynamics.tech"
website = "https://zainiumdynamics.tech"
license = "GPL-3.0-only"

[build]
rust_version = "1.97"
lto          = true
strip        = true

[features]
std                 = true
tokio_runtime       = true
message_bus         = true
tools               = true
traditional_activation = true
stats               = true
cookie_sha1         = true
unix_fd_passing     = true
systemd             = false
selinux             = false
apparmor            = true
libaudit            = false
launchd             = false
x11_autolaunch      = false

[paths]
prefix           = "/overlayer/syshub"
bindir           = "/overlayer/syshub/bin"
sbindir          = "/overlayer/syshub/bin"
libdir           = "/overlayer/syshub/lib"
includedir       = "/overlayer/syshub/include"
conf_dir         = "/overlayer/syshub/etc/oxibus"
policy_dir       = "/overlayer/syshub/etc/oxibus/policy.d"
services_dir     = "/overlayer/syshub/etc/oxibus/services"
vendor_services_dir = "/overlayer/syshub/lib/oxibus/services"
share_dir        = "/overlayer/syshub/share/oxibus"
runtime_dir      = "/run"
system_socket    = "/run/oxibus/system_bus_socket"
system_pid_file  = "/run/oxibus/pid"
session_socket_dir = "/tmp"
state_dir        = "/overlayer/syshub/var/lib/oxibus"
machine_id_file  = "/overlayer/syshub/var/lib/oxibus/machine-id"
launch_helper    = "/overlayer/syshub/libexec/oxibus-daemon-launch-helper"
legacy_system_socket = "/run/dbus/system_bus_socket"

[bus.system]
user             = "messagebus"
listen           = "unix:path=/run/oxibus/system_bus_socket"
pidfile          = "/run/oxibus/pid"
auth_mechanisms  = ["EXTERNAL", "DBUS_COOKIE_SHA1", "ANONYMOUS"]
allow_anonymous  = false

[bus.session]
listen              = "unix:tmpdir=/tmp"
auth_mechanisms      = ["EXTERNAL", "DBUS_COOKIE_SHA1"]
allow_anonymous      = false

[limits]
max_incoming_bytes         = 1_000_000_000
max_outgoing_bytes         = 1_000_000_000
max_message_size           = 134_217_728
max_message_unix_fds       = 1024
max_completed_connections  = 100_000
max_incomplete_connections = 64
max_connections_per_user   = 512
max_pending_service_starts = 512
max_names_per_connection   = 50_000
max_match_rules_per_connection = 50_000
activation_timeout_ms      = 25_000
auth_timeout_ms            = 30_000

[logging]
level  = "info"
ident  = "oxibus-daemon"
target = "stderr"
