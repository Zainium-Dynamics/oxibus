# Zainium OS Quantra service definition for OxiBus daemon.
# Target: /overlayer/syshub/engine/services/oxibus.toml

name        = "oxibus"
description = "OxiBus system message bus daemon"
command     = "/overlayer/syshub/bin/dbus-daemon"
args        = ["--system"]

restart              = "always"
restart_sec          = 2
max_restarts         = 0
notify_type          = "simple"
timeout_start        = 15
timeout_stop         = 10

runtime_directory    = "oxibus"
state_directory      = "oxibus"

condition_path_exists = ["/overlayer/syshub/etc/oxibus/oxibus.toml"]

# Required to preserve setuid-root operation on launch helper binaries
no_new_privileges = false
